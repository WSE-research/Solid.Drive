<!doctype html>
<html lang="en" data-theme="gdrive">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="soliddrive.css">
<style>
  .home-main { grid-area: main; background:#fff; margin:0 8px 8px 0; border-top-left-radius:16px;
               padding: 8px 24px 8px; overflow:auto; }
  .home-hero { text-align:center; font-size:22px; color:#1f1f1f; margin:14px 0 18px; }
  .home-search { max-width:720px; margin:0 auto 16px; }
  .home-filters { justify-content:center; }
  .sug-h { display:flex; align-items:center; gap:8px; font-size:15px; color:#444746; margin:16px 4px 10px; }
  .sug-h svg { width:20px; height:20px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:0 4px 6px; }
  .card { display:flex; align-items:center; gap:12px; height:56px; padding:0 14px;
          background:#f0f4f9; border-radius:12px; }
  .card .fic svg { width:24px; height:24px; }
  .card .ct { font-size:14px; color:#1f1f1f; }
  .card .cs { font-size:12px; color:#5f6368; }
  .card .kebab { margin-left:auto; }
</style>
</head>
<body class="shot">
<div class="app" data-active="home" style="grid-template-columns:256px 1fr; grid-template-areas:'top top' 'side main';">
  <main class="home-main">
    <div class="home-hero">Welcome to Solid.Drive</div>
    <div class="search home-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Search your Pod">
    </div>
    <div class="filters home-filters">
      <div class="chip">Type<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
      <div class="chip">People<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
      <div class="chip">Modified<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
      <div class="pod-chip"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="7.5" ry="2.8"/><path d="M4.5 5v14c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V5"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></svg></span>emily.solidpod.net<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
    </div>

    <div class="sug-h"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>Suggested containers</div>
    <div class="cards">
      <div class="card"><span class="fic"></span><div><div class="ct">datasets</div><div class="cs">in My Files</div></div><button class="kebab"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div>
      <div class="card"><span class="fic"></span><div><div class="ct">experiments</div><div class="cs">shared with you</div></div><button class="kebab"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div>
      <div class="card"><span class="fic"></span><div><div class="ct">field-media</div><div class="cs">in My Files</div></div><button class="kebab"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div>
    </div>

    <div class="sug-h"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>Recent files</div>
    <div class="table">
      <div class="thead"><div>Name</div><div>Reason</div><div>Owner</div><div>Location</div><div></div></div>
    </div>
  </main>
</div>
<script src="render.js"></script>
<script src="shell.js"></script>
<script>
  document.querySelectorAll('.card .fic').forEach(function(s){ s.innerHTML = SD.folderIcon(); });
  SD.renderRows('.table', [
    { name:'proposal-draft.docx', shared:true, cols:['<div class="cell">You opened · 2h ago</div>', SD.ownerCell('me'), SD.shareCell('myfiles','My Files')] },
    { name:'budget-2026.xlsx', shared:true, cols:['<div class="cell">You edited · Yesterday</div>', SD.ownerCell('theo'), SD.shareCell('shared','Shared')] },
    { name:'keynote-2026.pptx', cols:['<div class="cell">You opened · 3d ago</div>', SD.ownerCell('nadia'), SD.shareCell('shared','Shared')] },
    { name:'fieldwork-clip.mp4', cols:['<div class="cell">You opened · Now</div>', SD.ownerCell('ravi'), SD.shareCell('private','Private')] },
    { name:'survey-dataset.ttl', shared:true, cols:['<div class="cell">You opened · 01 Jun 2026</div>', SD.ownerCell('me'), SD.shareCell('public','Public')] },
    { name:'site-photos.zip', cols:['<div class="cell">You opened · 12 May 2026</div>', SD.ownerCell('lena'), SD.shareCell('private','Private')] },
    { name:'interview-notes.md', shared:true, cols:['<div class="cell">You opened · 08 May 2026</div>', SD.ownerCell('iris'), SD.shareCell('shared','Shared')] }
  ]);
</script>
</body>
</html>
