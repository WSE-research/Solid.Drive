<!doctype html>
<html lang="en" data-theme="gdrive">
<head><meta charset="utf-8"><link rel="stylesheet" href="soliddrive.css"></head>
<body class="shot">
<div class="app" data-active="bin" data-search="top">
  <main class="main">
    <div class="title-row">
      <div class="crumb"><span class="here">Recycle Bin</span></div>
      <div class="spacer"></div>
      <div class="seg"><button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button><button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></button></div>
      <button class="icon-btn" title="Details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>

    <div class="seltool">
      <button class="icon-btn x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="count">1 selected</span>
      <button class="icon-btn" title="Restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="icon-btn" title="Delete forever"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M9 6V4h6v2M8 6l1 14h6l1-14"/><path d="M10 10l4 6M14 10l-4 6"/></svg></button>
      <div style="margin-left:auto"></div>
      <button class="icon-btn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </div>

    <div class="table">
      <div class="thead">
        <div>Name</div><div>Deleted by</div>
        <div class="sortable">Date deleted <span class="arrow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 16l-5-6h10z"/></svg></span></div>
        <div>Original location</div>
        <div class="sortbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h12M3 12h9M3 18h6"/></svg></div>
      </div>
      <div class="section-label">Today</div>
    </div>
  </main>
</div>
<script src="render.js"></script>
<script src="shell.js"></script>
<script>
  SD.renderRows('.table', [
    { name:'draft-notes.md', sel:true, cols:[SD.ownerCell('me'), '<div class="cell">8:59 PM</div>', SD.shareCell('myfiles','My Files')] },
    { name:'old-results.csv', cols:[SD.ownerCell('me'), '<div class="cell">8:51 PM</div>', SD.shareCell('myfiles','datasets')] },
    { name:'scratch.json', cols:[SD.ownerCell('theo'), '<div class="cell">3:20 PM</div>', SD.shareCell('myfiles','experiments')] },
    { name:'test-render.png', cols:[SD.ownerCell('me'), '<div class="cell">Yesterday</div>', SD.shareCell('myfiles','field-media')] }
  ]);
</script>
</body>
</html>
