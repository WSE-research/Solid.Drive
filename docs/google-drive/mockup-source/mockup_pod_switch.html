<!doctype html>
<html lang="en" data-theme="gdrive">
<head><meta charset="utf-8"><link rel="stylesheet" href="soliddrive.css"></head>
<body class="shot">
<div class="app" data-active="myfiles" data-search="top">
  <main class="main">
    <div class="title-row">
      <div class="crumb"><span class="here">My Files</span><span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
      <div class="spacer"></div>
      <div class="seg"><button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button><button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></button></div>
      <button class="icon-btn" title="Details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
    <div class="filters">
      <div class="chip">Type<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
      <div class="chip">People<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
      <div class="chip">Modified<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
      <div class="pod-chip" id="podchip" style="border-color:var(--accent)"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="7.5" ry="2.8"/><path d="M4.5 5v14c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V5"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></svg></span>emily.solidpod.net<span class="caret"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span></div>
    </div>
    <div class="table">
      <div class="thead">
        <div class="sortable">Name <span class="arrow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8l5 6H7z"/></svg></span></div>
        <div>Owner</div><div>Modified</div><div>Sharing</div>
        <div class="sortbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h12M3 12h9M3 18h6"/></svg></div>
      </div>
    </div>
  </main>

  <div class="menu pod-menu" id="podmenu">
    <div class="ph">Your Pods</div>
    <div class="pod-item">
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg></span>
      <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="7.5" ry="2.8"/><path d="M4.5 5v14c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V5"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></svg></span>
      <span><span class="pn" style="display:block">emily.solidpod.net</span><span class="pd">Personal Pod</span></span>
    </div>
    <div class="pod-item">
      <span class="check"></span>
      <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="7.5" ry="2.8"/><path d="M4.5 5v14c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V5"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></svg></span>
      <span><span class="pn" style="display:block">emily.htwk.pod</span><span class="pd">University Pod</span></span>
    </div>
    <div class="pod-item">
      <span class="check"></span>
      <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="7.5" ry="2.8"/><path d="M4.5 5v14c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V5"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></svg></span>
      <span><span class="pn" style="display:block">lab.solidproject.net</span><span class="pd">Research Lab Pod</span></span>
    </div>
    <div class="msep"></div>
    <div class="pod-item add">
      <span class="check"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg></span>
      <span class="pn">Connect another Pod</span>
    </div>
  </div>
</div>
<script src="render.js"></script>
<script src="shell.js"></script>
<script>
  SD.renderRows('.table', [
    { name:'datasets', folder:true, cols:[SD.ownerCell('me'), '<div class="cell">20 Aug 2026</div>', SD.shareCell('private','Private')] },
    { name:'experiments', folder:true, shared:true, cols:[SD.ownerCell('me'), '<div class="cell">18 Aug 2026</div>', SD.shareCell('shared','3 people')] },
    { name:'proposal-draft.docx', cols:[SD.ownerCell('me'), '<div class="cell">2h ago</div>', SD.shareCell('private','Private')] },
    { name:'survey-dataset.ttl', shared:true, cols:[SD.ownerCell('me'), '<div class="cell">01 Jun 2026</div>', SD.shareCell('public','Public')] }
  ]);
  // anchor the pod menu just under the pod chip
  var chip = document.getElementById('podchip'), menu = document.getElementById('podmenu');
  var r = chip.getBoundingClientRect();
  menu.style.left = Math.round(r.left) + 'px';
  menu.style.top = Math.round(r.bottom + 6) + 'px';
</script>
</body>
</html>
