server {
    listen 80;
    server_name _;

    # The upstream reverse proxy terminates TLS and forwards requests with the
    # /solid.drive path prefix intact. Emit relative
    # redirects so nginx never drops the client back to http:// or to the
    # internal port.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    # Normalize the bare prefix to the trailing-slash form so the SPA's
    # relative asset URLs resolve correctly.
    location = /solid.drive {
        return 301 /solid.drive/;
    }

    location /solid.drive/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /solid.drive/index.html;

        # Long-cache hashed build assets
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # nginx's default mime.types has no Turtle entry, so tbox.ttl and the
        # catalog vocabulary would otherwise serve as application/octet-stream.
        location ~* \.ttl$ {
            default_type text/turtle;
        }
    }
}
