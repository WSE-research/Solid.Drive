; PHP settings for running the benchmark against php-solid-server.
; docker-compose mounts this into the container's conf.d, so PHP picks it up on
; start and you don't need to do anything by hand.
;
; Why these values: the soft-delete tests upload files up to 16 MB, and PHP's
; default upload and memory limits are far below that, so a large file would fail.
; The limits below make room for it, and max_execution_time lets a slow request
; run to the end instead of getting cut off mid-way.
;
; The opcache lines stop PHP from re-reading and recompiling the server's code on
; every request. Once it is compiled it stays cached for the whole run, so the
; timings measure the server rather than PHP warming up. If you edit the server's
; PHP code, set opcache.validate_timestamps back to 1 so it notices your changes.
memory_limit = 512M
post_max_size = 48M
upload_max_filesize = 48M
max_execution_time = 120
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
